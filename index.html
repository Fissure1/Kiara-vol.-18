<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiara · Vol. 18</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink:#0b0710;
    --paper:#f4ecfb;
    --gold:#e7c468;
    --accent:#b57edc;
    --accent-2:#8c5fc4;
    --accent-3:#d9b6f0;
    --grain: 0.05;
    --dur: 1s;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;}
  body{
    font-family:'Space Grotesk',sans-serif;
    color:var(--paper);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.2s !important;}
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 12%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--ink);
    transition: background-color var(--dur) ease;
  }

  /* ---------- ACT 1 — SLEEVE ---------- */
  .cover-stage{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    cursor:pointer;
    transition: transform 0.9s cubic-bezier(.7,0,.2,1), opacity 0.6s ease;
  }
  .cover-stage.lifted{ transform: translateY(-110%); opacity:0; pointer-events:none; }

  .sleeve{
    width:clamp(220px, 62vw, 380px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(18px,4vh,32px);
  }
  .sleeve-art{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:6px;
    background:
      linear-gradient(155deg, #14101b, #060409 70%);
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 30px 80px -20px rgba(0,0,0,0.8),
      0 0 40px -6px color-mix(in srgb, var(--accent) 55%, transparent);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
  }
  .glow-ring{
    position:absolute;
    inset:10%;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    box-shadow: 0 0 30px -4px var(--accent);
    animation: pulse-ring 3.4s ease-in-out infinite;
  }
  @keyframes pulse-ring{
    0%,100%{ opacity:.35; transform:scale(0.97); }
    50%{ opacity:.9; transform:scale(1.02); }
  }
  .eyebrow{
    font-size:clamp(10px,1.6vw,12px);
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--accent-3);
    opacity:.85;
    z-index:2;
  }
  .title{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(40px,11vw,72px);
    margin:.15em 0 0;
    z-index:2;
    letter-spacing:.01em;
  }
  .vol{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(13px,2.4vw,16px);
    letter-spacing:.18em;
    color:var(--gold);
    margin-top:.4em;
    z-index:2;
  }
  .tap-hint{
    font-size:clamp(11px,1.8vw,13px);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--paper);
    opacity:.55;
    animation: hint-fade 2.2s ease-in-out infinite;
  }
  @keyframes hint-fade{ 0%,100%{opacity:.35;} 50%{opacity:.8;} }

  /* ---------- ACT 2/3 — TURNTABLE ---------- */
  .turntable-stage{
    position:relative;
    width:100%;
    max-width:920px;
    height:100%;
    display:grid;
    grid-template-rows: auto auto auto;
    align-content:center;
    justify-items:center;
    gap:clamp(10px,2.2vh,22px);
    padding:clamp(14px,4vh,32px) clamp(14px,4vw,32px) calc(clamp(14px,4vh,32px) + env(safe-area-inset-bottom));
    opacity:0;
    transition: opacity 0.8s ease;
  }
  .turntable-stage.visible{ opacity:1; }

  .platter-wrap{
    position:relative;
    width:clamp(200px, 46vh, 320px);
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .platter{
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(circle, #1c1c1c 0%, #0a0a0a 70%, #050505 100%);
    box-shadow: 0 20px 50px -10px rgba(0,0,0,.7), 0 0 0 6px rgba(255,255,255,0.02) inset;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    cursor:grab;
  }
  .platter.dragging{ cursor:grabbing; }
  .vinyl{
    position:relative;
    width:92%;
    height:92%;
    border-radius:50%;
    background:
      repeating-radial-gradient(circle, rgba(255,255,255,0.045) 0 1px, transparent 2px 4px),
      radial-gradient(circle, #151515, #060606 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    will-change: transform;
    transform: rotate(0deg);
  }
  .label{
    position: relative;
    overflow: hidden;
    width:38%;
    height:38%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 70%, white 6%), var(--accent-2) 65%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4);
  }
  .label::after{
    content:"";
    position:absolute;
    width:8px;height:8px;border-radius:50%;
    background:#0a0a0a;
  }

  #coverImage{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    user-select:none;
    pointer-events:none;
  }

  .label span{ display:block; line-height:1.15; z-index:1; }
  .label #labelTitle{
    position:relative;
    z-index:2;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(13px,2.6vh,18px);
    color:#100a17;
  }
  .label #labelSub{
    position:relative;
    z-index:2;
    font-size:clamp(7px,1.3vh,9px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#241735;
    opacity:.75;
    margin-top:.2em;
  }

  .tonearm{
    position:absolute;
    top:-6%;
    right:-6%;
    width:46%;
    height:46%;
    transform-origin: 88% 12%;
    transform: rotate(-32deg);
    transition: transform .7s cubic-bezier(.6,0,.3,1);
    pointer-events:none;
    z-index:5;
  }
  .tonearm.dropped{ transform: rotate(-4deg); }
  .tonearm::before{
    content:"";
    position:absolute;
    top:10%; right:8%;
    width:6%; height:82%;
    border-radius:6px;
    background: linear-gradient(180deg, #d8d8d8, #8a8a8a);
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .tonearm::after{
    content:"";
    position:absolute;
    bottom:6%; left:2%;
    width:20%; height:8%;
    border-radius:3px;
    background: var(--gold);
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
  }

  .rpm-readout{
    font-size:clamp(10px,1.6vh,12px);
    letter-spacing:.16em;
    color:var(--accent-3);
    opacity:.8;
  }

  .notes{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .note-particle{
    position:absolute;
    left:50%; top:50%;
    font-size:clamp(12px,2.4vh,18px);
    color:var(--gold);
    animation: note-rise 1.6s ease-out forwards;
    opacity:0;
  }
  @keyframes note-rise{
    0%{ opacity:0; transform: translate(-50%,-50%) translate(0,0) scale(.6); }
    15%{ opacity:1; }
    100%{ opacity:0; transform: translate(-50%,-50%) translate(var(--nx), var(--ny)) scale(1.1) rotate(var(--nr)); }
  }

  .invite{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5em;
    opacity:0;
    transform: translateY(8px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .invite.show{ opacity:1; transform:none; }
  .invite-eyebrow{
    margin:0;
    font-size:clamp(11px,1.7vw,13px);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent-3);
    opacity:.85;
  }
  .invite h2{
    margin:0 0 .2em;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(22px,4.6vw,34px);
  }
  .detail{
    font-size:clamp(13px,2vw,15px);
    color:var(--paper);
    opacity:0;
    transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .detail.show{ opacity:.92; transform:none; }
  .maps-btn{
    margin-top:.6em;
    padding:.65em 1.6em;
    border-radius:999px;
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    color:var(--paper);
    text-decoration:none;
    font-size:clamp(12px,1.8vw,14px);
    letter-spacing:.06em;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    opacity:0;
    transition: opacity .5s ease, background .3s ease, transform .2s ease;
  }
  .maps-btn.show{ opacity:1; }
  .maps-btn:hover{ background: color-mix(in srgb, var(--accent) 32%, transparent); transform: translateY(-1px); }

  .crate{
    display:flex;
    gap:clamp(8px,1.6vw,14px);
    opacity:0;
    transition: opacity .6s ease .2s;
  }
  .crate.show{ opacity:1; }
  .disc-chip{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(10px,1.5vw,12px);
    letter-spacing:.05em;
    padding:.55em 1em;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04);
    color:var(--paper);
    cursor:pointer;
    transition: all .25s ease;
  }
  .disc-chip[aria-pressed="true"]{
    background: var(--accent);
    border-color: var(--accent);
    color:#100a17;
    font-weight:600;
  }
  .disc-chip:hover{ border-color: var(--accent); }

  /* ---------- THEMES ---------- */
  [data-theme="mj"]{
    --ink:#050505; --accent:#d9d9d9; --accent-2:#6fe9ff; --accent-3:#9fe7f2; --gold:#f2f2f2;
  }
  [data-theme="oliver"]{
    --ink:#0f1a12; --accent:#f4e23a; --accent-2:#39c98f; --accent-3:#57b8ff; --gold:#f4e23a;
  }
  [data-theme="olivia"]{
    --ink:#1a0f22; --accent:#e79ad6; --accent-2:#a98cf2; --accent-3:#8fb6ff; --gold:#f0c9ea;
  }

  .credit{
    position:absolute;
    bottom:6px;
    width:100%;
    text-align:center;
    font-size:9px;
    letter-spacing:.1em;
    color:rgba(255,255,255,0.25);
    z-index:2;
  }
</style>
</head>
<body>

<div id="app" data-theme="olivia">

  <div class="cover-stage" id="coverStage">
    <div class="sleeve">
      <div class="sleeve-art">
        <div class="glow-ring"></div>
        <span class="eyebrow">Álbum conmemorativo</span>
        <h1 class="title">Kiara</h1>
        <div class="vol">VOL. 18</div>
      </div>
      <p class="tap-hint">Toca para abrir</p>
    </div>
  </div>

  <div class="turntable-stage" id="turntableStage">
    <div class="platter-wrap">
      <div class="tonearm" id="tonearm"></div>
      <div class="platter" id="platter">
        <div class="vinyl" id="vinyl">
          <div class="label">

            <img
                id="coverImage"
                src="portadas/mj.jpg"
                alt="Portada">

            <span id="labelTitle">Kiara</span>

            <span id="labelSub">18 años</span>

          </div>
        </div>
      </div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="rpm-readout" id="rpmReadout"></div>

    <div class="invite" id="invite">
      <p class="invite-eyebrow">Estás invitado(a) a celebrar</p>
      <h2>Los 18 años de Kiara</h2>
      <div class="detail" data-d="1">📅 <span>01/08</span></div>
      <div class="detail" data-d="2">🕗 <span>5:00 PM</span></div>
      <div class="detail" data-d="3">📍 <span>P.º de Diamante, 55630 Conjunto Urbano La Esmeralda, Méx.</span></div>
      <a class="maps-btn" id="mapsBtn" href="https://maps.app.goo.gl/BSdMkAdoW7E7X3Ze7" target="_blank" rel="noopener">Ver ubicación</a>
    </div>

    <div class="crate" id="crate">
      <button class="disc-chip" data-theme="mj" aria-pressed="false">Michael Jackson</button>
      <button class="disc-chip" data-theme="oliver" aria-pressed="false">Oliver Tree</button>
      <button class="disc-chip" data-theme="olivia" aria-pressed="true">Olivia Rodrigo</button>
    </div>
  </div>

  <div class="credit">hecho a mano para Kiara · Vol. 18</div>
</div>

<script>
(function(){
  'use strict';

  /* ================================================================
     TRACKS — cambia canción reemplazando el archivo o esta ruta.
     Todo se carga localmente vía fetch(), sin CDN ni servicios externos.
  ================================================================ */
  const TRACKS = {
    mj:     'audio/mj.mp3',
    oliver: 'audio/oliver.mp3',
    olivia: 'audio/olivia.mp3'
  };

  const COVERS = {
    mj: "portadas/mj.jpg",
    oliver: "portadas/oliver.jpg",
    olivia: "portadas/olivia.jpg"
  };

  const THEMES = {
    mj:     { title:'Kiara', sub:'Billie Jean · 18' },
    oliver: { title:'Kiara', sub:'Vol. 18' },
    olivia: { title:'Kiara', sub:'18 años' }
  };

  const SECONDS_PER_REVOLUTION_33RPM = 60 / 33.333;

  /* ================================================================
     AudioEngine
     Única fuente de verdad del estado del audio. Usa exclusivamente
     Web Audio API + AudioWorklet. Nada de <audio>, nada de OscillatorNode
     para música, nada de setTimeout intentando adivinar posición.
  ================================================================ */
  class AudioEngine {
    constructor(){
      this.ctx = null;
      this.node = null;
      this.gain = null;
      this._workletReady = null;
      this.duration = 0;
      this.onPosition = null; // (seconds, durationSeconds, speed) => void
    }

    async ensureContext(){
      if(!this.ctx){
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(this.ctx.state === 'suspended'){
        await this.ctx.resume();
      }
      return this.ctx;
    }

    async _ensureWorklet(){
      if(this._workletReady) return this._workletReady;
      const ctx = await this.ensureContext();

      const processorSource = [
        'class ScratchProcessor extends AudioWorkletProcessor {',
        '  constructor(){',
        '    super();',
        '    this.channels = null;',
        '    this.length = 0;',
        '    this.position = 0;',
        '    this.speed = 0;',
        '    this.targetSpeed = 0;',
        '    this.easing = false;',
        '    this._reportCounter = 0;',
        '    this.port.onmessage = (e) => this._onMessage(e.data);',
        '  }',
        '  _onMessage(msg){',
        '    if(msg.type === "load"){',
        '      this.channels = msg.channels;',
        '      this.length = this.channels[0].length;',
        '      this.position = 0;',
        '      this.speed = 0;',
        '      this.targetSpeed = 0;',
        '      this.easing = false;',
        '    } else if(msg.type === "setSpeed"){',
        '      this.speed = msg.speed;',
        '      this.easing = false;',
        '    } else if(msg.type === "scratchBy"){',
        '      this.position += msg.deltaSamples;',
        '      this._clamp();',
        '      this.speed = 0;',
        '      this.easing = false;',
        '    } else if(msg.type === "releaseTo"){',
        '      this.speed = msg.fromSpeed;',
        '      this.targetSpeed = msg.toSpeed;',
        '      this.easing = true;',
        '    } else if(msg.type === "seek"){',
        '      this.position = msg.samples;',
        '      this._clamp();',
        '    }',
        '  }',
        '  _clamp(){',
        '    if(this.length === 0) return;',
        '    if(this.position < 0) this.position = 0;',
        '    if(this.position > this.length - 1) this.position = this.length - 1;',
        '  }',
        '  _read(channelData, pos){',
        '    const len = channelData.length;',
        '    const i0 = Math.floor(pos);',
        '    const i0c = Math.max(0, Math.min(i0, len - 1));',
        '    const i1c = Math.min(i0c + 1, len - 1);',
        '    const frac = pos - i0;',
        '    const s0 = channelData[i0c];',
        '    const s1 = channelData[i1c];',
        '    return s0 + (s1 - s0) * frac;',
        '  }',
        '  process(inputs, outputs){',
        '    const output = outputs[0];',
        '    const frames = output[0] ? output[0].length : 128;',
        '    if(!this.channels || this.length === 0){',
        '      for(let c=0;c<output.length;c++) output[c].fill(0);',
        '      return true;',
        '    }',
        '    const numOutCh = output.length;',
        '    const numSrcCh = this.channels.length;',
        '    for(let i=0;i<frames;i++){',
        '      if(this.easing){',
        '        this.speed += (this.targetSpeed - this.speed) * 0.02;',
        '        if(Math.abs(this.targetSpeed - this.speed) < 0.001){',
        '          this.speed = this.targetSpeed;',
        '          this.easing = false;',
        '        }',
        '      }',
        '      for(let c=0;c<numOutCh;c++){',
        '        const srcCh = this.channels[Math.min(c, numSrcCh - 1)];',
        '        output[c][i] = this._read(srcCh, this.position);',
        '      }',
        '      this.position += this.speed;',
        '      if(this.position <= 0){ this.position = 0; this.speed = 0; this.easing = false; }',
        '      if(this.position >= this.length - 1){ this.position = this.length - 1; this.speed = 0; this.easing = false; }',
        '    }',
        '    this._reportCounter += frames;',
        '    if(this._reportCounter >= 512){',
        '      this._reportCounter = 0;',
        '      this.port.postMessage({ type:"position", samples:this.position, speed:this.speed });',
        '    }',
        '    return true;',
        '  }',
        '}',
        'registerProcessor("scratch-processor", ScratchProcessor);'
      ].join('\n');

      const blob = new Blob([processorSource], { type:'application/javascript' });
      const url = URL.createObjectURL(blob);

      this._workletReady = ctx.audioWorklet.addModule(url).then(() => {
        this.node = new AudioWorkletNode(ctx, 'scratch-processor', {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [2]
        });
        this.gain = ctx.createGain();
        this.gain.gain.value = 0.9;
        this.node.connect(this.gain).connect(ctx.destination);
        this.node.port.onmessage = (e) => {
          if(e.data.type === 'position' && this.onPosition){
            this.onPosition(e.data.samples / ctx.sampleRate, this.duration, e.data.speed);
          }
        };
        URL.revokeObjectURL(url);
      });

      return this._workletReady;
    }

    async loadTrack(url){
      const ctx = await this.ensureContext();
      await this._ensureWorklet();
      const res = await fetch(url);
      if(!res.ok) throw new Error('No se pudo cargar ' + url);
      const arrayBuffer = await res.arrayBuffer();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
      const channels = [];
      for(let c=0;c<audioBuffer.numberOfChannels;c++){
        channels.push(audioBuffer.getChannelData(c).slice());
      }
      this.duration = audioBuffer.duration;
      this.node.port.postMessage({ type:'load', channels }, channels.map(c => c.buffer));
    }

    play(){ if(this.node) this.node.port.postMessage({ type:'setSpeed', speed:1 }); }
    stop(){ if(this.node) this.node.port.postMessage({ type:'setSpeed', speed:0 }); }
    seekToStart(){ if(this.node) this.node.port.postMessage({ type:'seek', samples:0 }); }
    setSpeedImmediate(speed){ if(this.node) this.node.port.postMessage({ type:'setSpeed', speed }); }
    scratchBySeconds(deltaSeconds){
      if(!this.node || !this.ctx) return;
      this.node.port.postMessage({ type:'scratchBy', deltaSamples: deltaSeconds * this.ctx.sampleRate });
    }
    releaseScratch(fromSpeed){
      if(this.node) this.node.port.postMessage({ type:'releaseTo', fromSpeed, toSpeed:1 });
    }

    // Small percussive "needle drop" texture. Uses AudioBufferSourceNode
    // (not OscillatorNode, not the music engine) — a one-shot FX layer only.
    playNeedleDrop(){
      const ctx = this.ctx;
      if(!ctx) return;
      const bufferSize = Math.floor(ctx.sampleRate * 0.3);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;
      const g = ctx.createGain();
      g.gain.value = 0.45;
      src.connect(filter).connect(g).connect(ctx.destination);
      src.start();
    }
  }

  /* ================================================================
     ScratchEngine
     Convierte el gesto del puntero sobre el plato en desplazamiento
     EXACTO de audio (no en una velocidad estimada). Una vuelta completa
     del plato a 33 RPM = 60/33.33 segundos de audio, igual que un
     tornamesa real.
  ================================================================ */
  class ScratchEngine {
    constructor(platterEl, audioEngine, opts){
      this.platter = platterEl;
      this.audio = audioEngine;
      this.secondsPerRevolution = opts.secondsPerRevolution;
      this.dragging = false;
      this.lastAngle = 0;
      this.recentDeltas = [];
      this.onScratchStart = opts.onScratchStart || function(){};
      this.onScratchEnd = opts.onScratchEnd || function(){};
      this._bind();
    }

    _angleFromCenter(clientX, clientY){
      const rect = this.platter.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      return Math.atan2(clientY - cy, clientX - cx);
    }

    _bind(){
      const down = (e) => {
        const p = e.touches ? e.touches[0] : e;
        this.dragging = true;
        this.lastAngle = this._angleFromCenter(p.clientX, p.clientY);
        this.recentDeltas = [];
        this.audio.setSpeedImmediate(0);
        this.onScratchStart();
      };

      const move = (e) => {
        if(!this.dragging) return;
        const p = e.touches ? e.touches[0] : e;
        const angle = this._angleFromCenter(p.clientX, p.clientY);
        let delta = angle - this.lastAngle;
        if(delta > Math.PI) delta -= Math.PI*2;
        if(delta < -Math.PI) delta += Math.PI*2;
        this.lastAngle = angle;

        // Physical rotation -> exact audio displacement, same ratio a real
        // 33RPM vinyl uses. Positive delta = forward, negative = reverse.
        const deltaSeconds = (delta / (Math.PI*2)) * this.secondsPerRevolution;
        this.audio.scratchBySeconds(deltaSeconds);

        this.recentDeltas.push(deltaSeconds);
        if(this.recentDeltas.length > 6) this.recentDeltas.shift();

        e.preventDefault && e.preventDefault();
      };

      const up = () => {
        if(!this.dragging) return;
        this.dragging = false;
        // Approximate release speed from the recent gesture only — no wall
        // clock involved, just the average of the last real deltas sent.
        const avg = this.recentDeltas.length
          ? this.recentDeltas.reduce((a,b)=>a+b,0) / this.recentDeltas.length
          : 0;
        // Convert seconds-per-move into a speed multiplier relative to
        // normal playback advance per worklet report window.
        const approxSpeed = avg === 0 ? 0 : Math.max(-8, Math.min(8, avg * 12));
        this.audio.releaseScratch(approxSpeed);
        this.onScratchEnd();
      };

      this.platter.addEventListener('mousedown', down);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
      this.platter.addEventListener('touchstart', down, { passive:true });
      window.addEventListener('touchmove', move, { passive:false });
      window.addEventListener('touchend', up);
    }
  }

  /* ================================================================
     TurntableController
     El vinilo NUNCA gira por su cuenta: su rotación visual se calcula
     directamente a partir de la posición real reportada por el
     AudioEngine, así que audio y disco jamás pueden desincronizarse.
  ================================================================ */
  class TurntableController {
    constructor({ platter, vinyl, rpmReadout, audioEngine }){
      this.platter = platter;
      this.vinyl = vinyl;
      this.rpmReadout = rpmReadout;
      this.audio = audioEngine;
      this.scratch = new ScratchEngine(platter, audioEngine, {
        secondsPerRevolution: SECONDS_PER_REVOLUTION_33RPM,
        onScratchStart: () => platter.classList.add('dragging'),
        onScratchEnd: () => platter.classList.remove('dragging')
      });

      this.audio.onPosition = (seconds) => {
        const revolutions = seconds / SECONDS_PER_REVOLUTION_33RPM;
        const deg = (revolutions * 360) % 360;
        this.vinyl.style.transform = 'rotate(' + deg + 'deg)';
      };

      // Separately, poll the worklet's reported speed for the RPM readout
      // via the same position callback signature (speed passed through).
      const originalOnPosition = this.audio.onPosition;
      this.audio.onPosition = (seconds, duration, speed) => {
        originalOnPosition(seconds, duration, speed);
        const rpm = Math.round((speed || 0) * 33.333);
        this.rpmReadout.textContent = (rpm === 0 ? 33 : Math.abs(rpm)) + ' RPM' + (rpm < 0 ? ' ◄' : '');
      };
    }
  }

  /* ================================================================
     UIController — cosmética: portada, invitación, crate de temas,
     partículas de notas. No toca el motor de audio directamente,
     solo lo invoca a través de AudioEngine.
  ================================================================ */
  class UIController {
    constructor(){
      this.app = document.getElementById('app');
      this.coverStage = document.getElementById('coverStage');
      this.turntableStage = document.getElementById('turntableStage');
      this.platter = document.getElementById('platter');
      this.vinyl = document.getElementById('vinyl');
      this.tonearm = document.getElementById('tonearm');
      this.rpmReadout = document.getElementById('rpmReadout');
      this.notes = document.getElementById('notes');
      this.invite = document.getElementById('invite');
      this.crate = document.getElementById('crate');
      this.chips = Array.from(document.querySelectorAll('.disc-chip'));
      this.label = document.querySelector('.label');
      this.coverImage = document.getElementById('coverImage');
      this.labelTitle = document.getElementById('labelTitle');
      this.labelSub = document.getElementById('labelSub');

      this.currentTheme = 'olivia';
      this.coverImage.src = COVERS[this.currentTheme];
      this.audio = new AudioEngine();
      this.turntable = new TurntableController({
        platter: this.platter,
        vinyl: this.vinyl,
        rpmReadout: this.rpmReadout,
        audioEngine: this.audio
      });

      this._bindCover();
      this._bindChips();
    }

    async _startPlayback(themeId){
      await this.audio.loadTrack(TRACKS[themeId]);

      this.coverImage.src = COVERS[themeId];

      this.audio.seekToStart();
      this.vinyl.classList.add('spinning');
      this.audio.playNeedleDrop();
      this.audio.play();
      this.startNoteSpawn();
    }

    _bindCover(){
      this.coverStage.addEventListener('click', async () => {
        await this.audio.ensureContext();
        this.coverStage.classList.add('lifted');
        this.turntableStage.classList.add('visible');

        setTimeout(async () => {
          this.tonearm.classList.add('dropped');
          try {
            await this._startPlayback(this.currentTheme);
          } catch(err){
            console.error(err);
          }
        }, 550);

        const detailEls = Array.from(this.invite.querySelectorAll('.detail'));
        setTimeout(() => this.invite.classList.add('show'), 900);
        detailEls.forEach((d, i) => setTimeout(() => d.classList.add('show'), 1300 + i*260));
        setTimeout(() => document.getElementById('mapsBtn').classList.add('show'), 1300 + detailEls.length*260 + 150);
        setTimeout(() => this.crate.classList.add('show'), 1300 + detailEls.length*260 + 350);
      }, { once:true });
    }

    _bindChips(){
      this.chips.forEach(chip => {
        chip.addEventListener('click', () => this.swapTheme(chip.dataset.theme));
      });
    }

    async swapTheme(themeId){
      if(themeId === this.currentTheme) return;
      const t = THEMES[themeId];
      if(!t || !TRACKS[themeId]) return;

      this.tonearm.classList.remove('dropped');
      this.vinyl.classList.remove('spinning');
      this.audio.stop();
      this.stopNoteSpawn();

      setTimeout(async () => {
        this.currentTheme = themeId;
        this.app.setAttribute('data-theme', themeId);
        this.labelTitle.textContent = t.title;
        this.labelSub.textContent = t.sub;
        this.chips.forEach(c => c.setAttribute('aria-pressed', String(c.dataset.theme === themeId)));

        this.tonearm.classList.add('dropped');
        try {
          await this._startPlayback(themeId);
        } catch(err){
          console.error(err);
        }
      }, 420);
    }

    spawnNote(){
      const el = document.createElement('span');
      el.className = 'note-particle';
      el.textContent = ['♫','♪','♩','♬'][Math.floor(Math.random()*4)];
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*50;
      el.style.setProperty('--nx', Math.cos(angle)*dist + 'px');
      el.style.setProperty('--ny', (Math.sin(angle)*dist - 40) + 'px');
      el.style.setProperty('--nr', (Math.random()*40-20) + 'deg');
      this.notes.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }

    startNoteSpawn(){
      if(this.noteSpawnTimer) clearInterval(this.noteSpawnTimer);
      this.noteSpawnTimer = setInterval(() => this.spawnNote(), 420);
    }

    stopNoteSpawn(){
      if(this.noteSpawnTimer) clearInterval(this.noteSpawnTimer);
    }
  }

  new UIController();

})();
</script>
</body>
</html>
